# Netlify hosting config for the GDG Go WebGL build.
# Place this file at the root of the folder you deploy (web-hosting/).
# Source: docs/PROJECT.md §7.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------- Security headers ----------
# connect-src is the load-bearing one: run secrets and the retry queue live in
# localStorage, so even a successful XSS must not be able to POST them to an
# attacker's host. script-src keeps 'unsafe-inline' because index.html runs an
# inline pre-paint theme script and Unity's generated host page bootstraps
# inline; external script origins are still blocked. 'wasm-unsafe-eval' is
# required by the Unity WebGL player.

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

# ---------- Caching & content-encoding ----------

# Unity outputs .br (brotli) variants alongside the original files. Netlify
# auto-negotiates them, but we set explicit Content-Encoding headers for the
# decompression-fallback path Unity uses.

[[headers]]
  for = "/Build/*.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type     = "application/octet-stream"
    Cache-Control    = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Build/*.wasm.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type     = "application/wasm"
    Cache-Control    = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Build/*.js.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type     = "application/javascript"
    Cache-Control    = "public, max-age=31536000, immutable"

# Unity also writes gzip variants as .gz; covering them is harmless and helps
# CDNs that prefer gzip over brotli.

[[headers]]
  for = "/Build/*.gz"
  [headers.values]
    Content-Encoding = "gzip"
    Cache-Control    = "public, max-age=31536000, immutable"

# TemplateData sprites can be cached aggressively.
[[headers]]
  for = "/TemplateData/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# index.html is small and updated on every build — never cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[functions]
  # Reserved — no serverless functions in MVP. WebGL build talks to Supabase directly.
  directory = "netlify-functions"
